<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Понемногу">
  <title>Понемногу</title>
  <!-- Знак: три плашки, каждая выше шире и правее предыдущей.
       Понемногу, слой за слоем — и выросло. Верхняя плашка акцентная. -->
  <g fill="#1B1613">
    <rect x="3.4" y="23.8" width="12.0" height="7.2" rx="3.6"/>
    <rect x="7.0" y="12.4" width="15.6" height="7.2" rx="3.6"/>
  </g>
  <rect x="10.6" y="1.0" width="19.2" height="7.2" rx="3.6" fill="#E8501E"/>
</svg>
